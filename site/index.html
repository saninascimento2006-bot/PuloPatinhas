<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulo Patinha - Hotel e Chácara para Cães</title>
    <meta name="description" content="Hotel e chácara para hospedagem de cachorros. Seu melhor amigo em boas mãos.">
    <link rel="icon" type="image/x-icon" href="images/Icon.ico">
<link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <header class="hero">
        <div class="hero-bg" style="background-image: url('images/hero_bg.jpg')"></div>
        <div class="hero-content">
            <img src="images/Logo.png" alt="Pulo Patinha logo" class="logo">

            <section class="hero-text">
                <h2>Seu melhor amigo<br><strong style="color: var(--light-yellow)">em boas mãos!</strong></h2>
                <p class="subtitle">Viajar é bom, mas deixar seu cachorro<br>com alguém de confiança faz toda a
                    diferença.</p>
                <p class="description">Aqui, seu pet tem espaço, cuidado e muita diversão<br>em um ambiente seguro e
                    acolhedor.</p>

                <a href="https://www.petlove.com.br/dicas" class="cta-button">

                    <!-- Ícone do Google via Font -->
                    <span class="material-symbols-outlined">sound_detection_dog_barking</span>

                    CONHEÇA MAIS

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>

            </section>
        </div>
        <div class="curve-bottom">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path d="M0,0 C480,150 960,150 1440,0 L1440,120 L0,120 Z" fill="#FDF8EC"></path>
            </svg>
        </div>
    </header>

    <main class="gallery-section">
        <div class="gallery">
            <img src="images/dog1.jpg" alt="Cachorro da raça Golden Retriever correndo feliz na grama"
                class="gallery-img">
            <img src="images/dog2.jpg" alt="Cachorro da raça Border Collie sentado no parque" class="gallery-img">
            <img src="images/dog3.jpg" alt="Quarto interno do hotel com várias camas confortáveis para cães"
                class="gallery-img">
            <img src="images/dog4.jpg" alt="Playground externo para cães com túneis e rampas" class="gallery-img">
        </div>
    </main>

    <footer class="footer">
        <div class="curve-top">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path d="M0,120 C480,-30 960,-30 1440,120 L1440,120 L0,120 Z" fill="#FDF8EC"></path>
                <path d="M0,120 C480,20 960,20 1440,120 L1440,120 L0,120 Z" fill="#3B8B2E"></path>
            </svg>
        </div>
        <div class="footer-content">
            <a href="https://www.instagram.com/" class="social-link" aria-label="Acessar Instagram">
                <div class="icon-circle bg-instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </div>
                <span>INSTAGRAM</span>
            </a>

            <a href="https://web.whatsapp.com/" class="social-link" aria-label="Entrar em contato via Whatsapp">
                <div class="icon-circle bg-whatsapp">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                        </path>
                    </svg>
                </div>
                <span>WHATSAPP</span>
            </a>

            <a href="https://www.google.com/maps" class="social-link" aria-label="Ver localização no mapa">
                <div class="icon-circle bg-location">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <span>LOCALIZAÇÃO</span>
            </a>
        </div>
    </footer>
</body>

</html>
